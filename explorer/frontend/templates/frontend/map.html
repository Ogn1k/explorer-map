{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <title>Explorer - Карта</title>
    <!-- Подключаем OpenLayers CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.5.2/ol.css">
    <!-- Подключаем наши стили для карты -->
    <link rel="stylesheet" href="{% static 'frontend/css/mapStyles.css' %}">
    <!-- Подключаем стили для профиля -->
    <link rel="stylesheet" href="{% static 'frontend/css/profileStyles.css' %}">
    <!-- Подключаем стили для меток -->
    <link rel="stylesheet" href="{% static 'frontend/css/marks.css' %}">
    <link rel="stylesheet" href="{% static 'frontend/css/mark.css' %}">
</head>
<body>
    <div id="app">
        {% include "frontend/sidePanel.html" %}

        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- Подключаем Vue 3 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <!-- Подключаем OpenLayers -->
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.8.0/dist/ol.js"></script>

    <!-- Подключаем JavaScript файлы приложения -->
    <script src="{% static 'frontend/js/map.js' %}"></script>
    <script>
        // Инициализируем приложение
        const { createApp } = Vue;
        const appConfig = initMapApp();
        createApp(appConfig).mount('#app');
    </script>
</body>
</html>
